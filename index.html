<!DOCTYPE html>
<html>

<head>
  
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
<meta charset="utf-8">

<title>인천신호</title>

<style>

html, body, #map {
    width:100%;
    height:100%;
    margin:0;
}

#gpsBtn{
    position:absolute;
    right:15px;
    bottom:20px;
    width:55px;
    height:55px;
    border-radius:50%;
    border:none;
    background:white;
    font-size:24px;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
    z-index:999;
}

#searchBox{
    position:absolute;
    top:10px;
    left:10px;
    width:220px;
    height:40px;
    font-size:18px;
    padding-left:10px;
    z-index:999;
}

#searchBtn{
    position:absolute;
    top:10px;
    left:240px;
    height:44px;
    font-size:16px;
    z-index:999;
}

</style>

</head>

<body>

<div id="map"></div>

<input
id="searchBox"
type="text"
placeholder="신호기 검색">

<button id="searchBtn">
검색
</button>

<button id="gpsBtn">
📍
</button>
  

<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=d1b45b81fdbbcf51dc6599c61fd53a5f&libraries=clusterer"></script>

<script>
  
let signalData = [];

    
const map=new kakao.maps.Map(

document.getElementById("map"),

{

center:new kakao.maps.LatLng(37.4563,126.7052),
level:8

}

);
fetch("https://script.google.com/macros/s/AKfycbybhRXaSQfsKlM8V1UnPVD21WQLmoJLtIvkBFXHJ131caZgUHI4G99YDtIGlkNaIN-I/exec")

.then(data=>{
    signalData = data;
  
.then(res=>res.json())

.then(data=>{

const markers=[];

data.forEach(item=>{

const marker=new kakao.maps.Marker({

position:new kakao.maps.LatLng(item.lat,item.lng)

});

const infowindow=new kakao.maps.InfoWindow({

content:

`<div style="padding:8px">

<b>${item.name}</b><br>

수정날짜 : ${item.type}<br>


</div>`

});

kakao.maps.event.addListener(marker,"click",function(){

infowindow.open(map,marker);

});

markers.push(marker);

});

const clusterer=new kakao.maps.MarkerClusterer({

map:map,

averageCenter:true,

minLevel:8

});

clusterer.addMarkers(markers);

});

  document.getElementById("gpsBtn").onclick=function(){

    if(!navigator.geolocation){

        alert("현재 위치를 사용할 수 없습니다.");

        return;

    }

    navigator.geolocation.getCurrentPosition(function(position){

        const lat=position.coords.latitude;

        const lng=position.coords.longitude;

        const loc=new kakao.maps.LatLng(lat,lng);

        map.setCenter(loc);

        map.setLevel(3);

        new kakao.maps.Marker({

            map:map,

            position:loc

        });

    });

};
    document.getElementById("searchBtn").onclick=function(){

    const keyword=document.getElementById("searchBox").value.trim();

    if(keyword=="") return;

    const item=signalData.find(x=>

        x.name.includes(keyword)

    );

    if(!item){

        alert("검색 결과가 없습니다.");

        return;

    }

    map.setCenter(

        new kakao.maps.LatLng(

            Number(item.lat),

            Number(item.lng)

        )

    );

    map.setLevel(2);

};
    document.getElementById("searchBox").addEventListener("keydown",function(e){

    if(e.key==="Enter"){

        document.getElementById("searchBtn").click();

    }

});
</script>

</body>

</html>
