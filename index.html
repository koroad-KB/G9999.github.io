<script>

const map = new kakao.maps.Map(

    }
);
kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
    if(currentInfoWindow){
        currentInfoWindow.close();
        currentInfoWindow = null;
    }
  if(!coordMode){
    return;
}
coordMode = false;

document.getElementById("coordBtn").style.background="white";
document.getElementById("coordBtn").innerHTML="📍";
document.getElementById("copyBtn").style.display="block";
    const latlng = mouseEvent.latLng;

    clickLat = latlng.getLat().toFixed(6);
    clickLng = latlng.getLng().toFixed(6);
  
      document.getElementById("coordBox").innerHTML =
        "위도 : " + clickLat +

    if(clickMarker){
        clickMarker.setMap(null);

fetch("https://script.google.com/macros/s/AKfycbybhRXaSQfsKlM8V1UnPVD21WQLmoJLtIvkBFXHJ131caZgUHI4G99YDtIGlkNaIN-I/exec")

.then(res => res.json())
.then(data => {
    signalData = data;
  

const markers = [];
const overlays = [];
const numberOverlays = [];


data.forEach(item => {

    // ========================================
    // 신호기의 실제 위치
    // ========================================

    nameDiv.style.cssText = `

    `<span style="color:${item.nameColor || '#000000'}">${item.name}</span>`;

    // ========================================
    // ② 이름을 실제 좌표의 정확한 중심에 배치
    // ========================================
    const overlay = new kakao.maps.CustomOverlay({

        position: position,

        xAnchor: 0.5,
        yAnchor: 0.5,

        clickable: true,

        content: nameDiv
    });

    overlay.setMap(map);

    overlays.push(overlay);



const infowindow = new kakao.maps.InfoWindow({

    content: `
            <div style="
            padding:12px;
            font-size:14px;
            line-height:1.7;
            min-width:220px;
        ">

            <div style="
                font-size:17px;
                font-weight:bold;
                margin-bottom:8px;
                border-bottom:1px solid #ddd;
                padding-bottom:6px;
            ">
                ${item.code}(${item.group})-${item.name}
            </div>

            <div>
                <b>지역</b> : ${item.region || "-"}<br>
                <b>지자체</b> : ${item.local || "-"}<br>
                <b>경찰서</b> : ${item.police || "-"}<br>
                <b>보호구역</b> : ${item.protectedArea || "-"}<br>
                <b>스마트교차로</b> : ${item.smart || "-"}
            </div>

            <br>

            <div style="
                display:flex;
                gap:6px;
            ">

                <button
                    onclick="routeTo(
                        ${item.lat},
                        ${item.lng},
                        '${item.name}'
                    )"
                    style="
                        flex:1;
                        padding:7px;
                        background:#FEE500;
                        border:none;
                        border-radius:6px;
                        font-size:11px;
                        font-weight:bold;
                        cursor:pointer;
                    "
                >
                    🧭 길찾기
                </button>

                <button
                    onclick="roadView(
                        ${item.lat},
                        ${item.lng}
                    )"
                    style="
                        flex:1;
                        padding:7px;
                        background:#4CAF50;
                        color:white;
                        border:none;
                        border-radius:6px;
                        font-size:11px;
                        font-weight:bold;
                        cursor:pointer;
                    "
                >
                    📷 로드뷰
                </button>

            </div>

        </div>
    `
});

    // ========================================
    // ④ 이름 클릭 → 상세정보
    // ========================================
    nameDiv.onclick = function(e) {

        e.stopPropagation();

        if(currentInfoWindow){
            currentInfoWindow.close();
        }

        infowindow.setPosition(position);
        infowindow.open(map);

        currentInfoWindow = infowindow;
    };


    // ========================================
    // ⑤ 투명 Marker
    //    → 클러스터링 + 실제 위치 클릭용
    // ========================================
    const image = new kakao.maps.MarkerImage(

        "data:image/gif;base64," +
        "R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=",

        new kakao.maps.Size(1, 1)
    );


    const marker = new kakao.maps.Marker({

        position: position,

        image: image,

        clickable: true
    });


    // ========================================
    // ⑥ 투명 Marker 클릭
    // ========================================
    kakao.maps.event.addListener(
        marker,
        "click",
        function(){

            if(currentInfoWindow){
                currentInfoWindow.close();
            }

            infowindow.setPosition(position);
            infowindow.open(map);

            currentInfoWindow = infowindow;
        }
    );


    markers.push(marker);

});


const clusterer=new kakao.maps.MarkerClusterer({

map:map,

averageCenter:true,

minLevel:8

});

clusterer.addMarkers(markers);
  function updateOverlayVisible(){

    const level = map.getLevel();

    overlays.forEach(function(overlay){

        if(level >= 8){
            overlay.setMap(null);      // 이름 숨김
        }else{
            overlay.setMap(map);       // 이름 표시
        }

    });

}

updateOverlayVisible();

kakao.maps.event.addListener(map, "zoom_changed", updateOverlayVisible);

});

let myLocationMarker = null;

document.getElementById("gpsBtn").onclick = function(){

    if(!navigator.geolocation){

        alert("현재 위치를 사용할 수 없습니다.");
        return;

    }

    const gpsBtn = this;

    // 누르는 즉시 버튼 표시 변경
    gpsBtn.style.background = "#E3F2FD";
    gpsBtn.innerHTML = "⏳";

    navigator.geolocation.getCurrentPosition(

        function(position){

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            const loc = new kakao.maps.LatLng(lat, lng);

            // 기존 위치 마커 제거
            if(myLocationMarker){
                myLocationMarker.setMap(null);
            }

            // 현재 위치 표시
            myLocationMarker = new kakao.maps.Marker({
                map: map,
                position: loc
            });

            // 지도 이동
            map.setCenter(loc);
            map.setLevel(3);

            // 버튼 원래대로
            gpsBtn.style.background = "white";
            gpsBtn.innerHTML = `
                <svg viewBox="0 0 64 64" width="38" height="38">
                    <circle cx="32" cy="32" r="18"
                            fill="none"
                            stroke="#1976D2"
                            stroke-width="3"/>

                    <line x1="32" y1="10" x2="32" y2="21"
                          stroke="#1976D2"
                          stroke-width="3"
                          stroke-linecap="round"/>

                    <line x1="32" y1="43" x2="32" y2="54"
                          stroke="#1976D2"
                          stroke-width="3"
                          stroke-linecap="round"/>

                    <line x1="10" y1="32" x2="21" y2="32"
                          stroke="#1976D2"
                          stroke-width="3"
                          stroke-linecap="round"/>

                    <line x1="43" y1="32" x2="54" y2="32"
                          stroke="#1976D2"
                          stroke-width="3"
                          stroke-linecap="round"/>

                    <circle cx="32" cy="32" r="4"
                            fill="#1976D2"/>
                </svg>
            `;

        },

        function(error){

            gpsBtn.style.background = "white";
            gpsBtn.innerHTML = "📍";

            if(error.code === 1){
                alert("위치 정보 사용이 차단되어 있습니다.");
            }
            else if(error.code === 2){
                alert("현재 위치를 확인할 수 없습니다.");
            }
            else if(error.code === 3){
                alert("현재 위치 확인 시간이 초과되었습니다.");
            }
            else{
                alert("현재 위치를 확인할 수 없습니다.");
            }

        },

        {
            enableHighAccuracy: false,
            timeout: 30000,
            maximumAge: 60000
        }

    );

};
document.getElementById("searchBtn").onclick=function(){

    const searchBox = document.getElementById("searchBox");

    const keyword = searchBox.value.trim();

    if(keyword == "") {
        searchBox.blur();
        return;
    }

 const item = signalData.find(x =>
    (x.name && x.name.includes(keyword)) ||
    (String(x.code).includes(keyword)) ||
    (String(x.group).includes(keyword))
);

    if(!item){

        alert("검색 결과가 없습니다.");

        searchBox.blur();

        return;
    }

    map.setCenter(
        new kakao.maps.LatLng(
            Number(item.lat),
            Number(item.lng)
        )
    );

    map.setLevel(2);

searchBox.value = ""; 
searchBox.blur();

};
document.getElementById("searchBox").addEventListener("keydown",function(e){

    if(e.key === "Enter"){

        e.preventDefault();

        document.getElementById("searchBtn").click();

        this.blur();
    }

});
  document.getElementById("copyBtn").onclick = function(){

    if(clickLat==""){
        alert("먼저 지도를 클릭하세요.");
        return;
    }

    navigator.clipboard.writeText(clickLat + "," + clickLng);


};
  function routeTo(lat,lng,name){

    const url =

    encodeURIComponent(name) +

    "," +
    lng;

    window.open(url,"_blank");

}
  function roadView(lat, lng){

    const url =
    "https://map.kakao.com/link/roadview/" +
    lat + "," + lng;

    window.open(url, "_blank");

}
  
  document.getElementById("coordBtn").onclick = function(){

    coordMode = !coordMode;

    if(coordMode){
      document.getElementById("coordBox").style.display = "none";
        this.style.background="#4CAF50";
        this.innerHTML="✅";
}else{
    this.style.background = "white";
    this.innerHTML = "📌";
    document.getElementById("coordBox").style.display = "none";
    document.getElementById("copyBtn").style.display = "none";

    if(clickMarker){
        clickMarker.setMap(null);
        clickMarker = null;
    }
}

};
let skyViewMode = false;

document.getElementById("skyBtn").onclick = function(){

    skyViewMode = !skyViewMode;

    if(skyViewMode){

        map.setMapTypeId(kakao.maps.MapTypeId.SKYVIEW);

        this.style.background = "#4CAF50";
        this.innerHTML = "🗺️";

    }else{

        map.setMapTypeId(kakao.maps.MapTypeId.ROADMAP);

        this.style.background = "white";
        this.innerHTML = "✈️";
    }

};


// ========================================
// 거리재기
// ========================================

let distanceMode = false;

let distancePoints = [];

let distanceLine = null;

let distanceMarkers = [];


// 거리 계산 함수
function getDistance(p1, p2){

    const lat1 = p1.getLat();
    const lon1 = p1.getLng();

    const lat2 = p2.getLat();
    const lon2 = p2.getLng();

    const R = 6371000;

    const dLat = (lat2-lat1) * Math.PI / 180;
    const dLon = (lon2-lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon/2) * Math.sin(dLon/2);

    const c = 2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1-a)
    );

    return R * c;
}


// 거리재기 버튼
document.getElementById("distanceBtn").onclick = function(){

    distanceMode = !distanceMode;

    if(distanceMode){

        this.style.background = "#4CAF50";
        this.innerHTML = "❌";

        distancePoints = [];

        document.getElementById("distanceBox").style.display = "block";
        document.getElementById("distanceBox").innerHTML =
            "📏 지도를 클릭하세요";

    }else{

        this.style.background = "white";
        this.innerHTML = "📏";

        clearDistance();

    }

};


// 지도 클릭 시 거리 측정
kakao.maps.event.addListener(map, "click", function(mouseEvent){

    if(!distanceMode){
        return;
    }

    const point = mouseEvent.latLng;

    distancePoints.push(point);


    // 측정 지점 표시
    const marker = new kakao.maps.Marker({
        map: map,
        position: point
    });

    distanceMarkers.push(marker);


    // 두 번째 점부터 선 표시
    if(distancePoints.length >= 2){

        if(distanceLine){
            distanceLine.setMap(null);
        }

        distanceLine = new kakao.maps.Polyline({

            map: map,

            path: distancePoints,

            strokeWeight: 4,

            strokeColor: "#1976D2",

            strokeOpacity: 0.8,

            strokeStyle: "solid"

        });


        // 전체 거리 계산
        let totalDistance = 0;

        for(let i = 1; i < distancePoints.length; i++){

            totalDistance += getDistance(
                distancePoints[i-1],
                distancePoints[i]
            );

        }


        let text;

        if(totalDistance >= 1000){

            text =
                "📏 거리 : " +
                (totalDistance / 1000).toFixed(2) +
                " km";

        }else{

            text =
                "📏 거리 : " +
                Math.round(totalDistance) +
                " m";

        }


        document.getElementById("distanceBox").innerHTML =
            text +
            "<br><span style='font-size:11px;font-weight:normal;'>지점을 계속 클릭하세요</span>";

    }else{

        document.getElementById("distanceBox").innerHTML =
            "📏 첫 번째 지점 선택<br>" +
            "<span style='font-size:11px;font-weight:normal;'>두 번째 지점을 클릭하세요</span>";

    }

});


// 거리 측정 초기화
function clearDistance(){

    distanceMode = false;

    distancePoints = [];


    if(distanceLine){

        distanceLine.setMap(null);

        distanceLine = null;

    }


    distanceMarkers.forEach(function(marker){

        marker.setMap(null);

    });

    distanceMarkers = [];


    document.getElementById("distanceBox").style.display = "none";

}  
</script>
